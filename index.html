a Oliveira",turma:"6\xBA Ano A",componente:"Matem\xE1tica",date:"2026-09-15",status:"completed",turmaMedia:"7.8",alunoDestaque:"Ana Beatriz Souza e Lucas Ferreira",answers:{q_1_1:"A turma demonstra bom rendimento global nas opera\xE7\xF5es b\xE1sicas, por\xE9m necessita de mais tempo de concentra\xE7\xE3o na resolu\xE7\xE3o de situa\xE7\xF5es-problema complexas.",q_1_2:"A maioria dos estudantes \xE9 bastante participativa e faz as atividades propostas em aula. Um pequeno grupo ainda se distrai com facilidade no fundo da sala.",q_media:"M\xE9dia 7,8 - Rendimento satisfat\xF3rio no bimestre. Mais de 80% da turma obteve nota acima de 7,0 nas avalia\xE7\xF5es formativas e participou com destaque das olimp\xEDadas internas.",q_2_1:"Fra\xE7\xE3o e interpreta\xE7\xE3o de enunciados que envolvem mais de duas etapas de racioc\xEDnio l\xF3gico.",q_2_2:"O aluno Gabriel Santos faltou 7 dias no m\xEAs por quest\xF5es de sa\xFAde relatadas pelos respons\xE1veis. Precisa de apoio nas listas de revis\xE3o.",q_3_1:"Ana Beatriz Souza e Lucas Ferreira - excelente racioc\xEDnio, ajudam os colegas durante as atividades em dupla.",q_3_2:"Matheus Henrique - grande bloqueio com tabuada e inseguran\xE7a ao participar oralmente.",q_4_1:"Realizamos oficinas com jogos matem\xE1ticos concretos e listas semanais de fixa\xE7\xE3o. Sugiro continuidade de monitoria entre pares.",q_4_2:"Conversar com a fam\xEDlia do aluno Matheus para alinhamento pedag\xF3gico e incentivo ao estudo em casa.",q_5_1:"Turma com excelente potencial de crescimento. Se mantermos a rotina de estudos e o trabalho colaborativo, ter\xE3o \xF3timo fechamento de ciclo."},updatedAt:"2026-09-15T14:30:00Z",submittedAt:"2026-09-15T14:30:00Z"},{id:"eval_sample_2",professorId:"prof_carlos",professorName:"Prof. Carlos Silva",turma:"6\xBA Ano A",componente:"L\xEDngua Portuguesa",date:"2026-09-14",status:"completed",turmaMedia:"8.2",alunoDestaque:"Ana Beatriz Souza e Sofia Lima",answers:{q_1_1:"Evolu\xE7\xE3o positiva na leitura compart
